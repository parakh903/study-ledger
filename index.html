<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C1C1E;
  --surface:#050505;
  --surface-2:#111113;
  --line: rgba(237,239,243,0.10);
  --line-strong: rgba(237,239,243,0.20);
  --text:#EDEFF3;
  --muted:#8996AC;
  --income:#3FAE7A;
  --expense:#FF7A59;
  --loan:#5C8AC4;
  --rental:#3E9C9C;
  --lottery:#D8AE4C;
  --radius:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
a{color:inherit;}
button, select, input{font-family:inherit; font-size:15px;}
input, select{
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--text);
  padding:10px 12px; border-radius:8px; width:100%;
}
input:focus, select:focus{outline:2px solid var(--loan); outline-offset:1px;}
label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.02em; text-transform:uppercase;}
.field{margin-bottom:14px;}
.btn{
  background:var(--loan); color:#0B1524; border:none; padding:11px 18px; border-radius:8px;
  font-weight:600; cursor:pointer; font-size:14px;
}
.btn:active{transform:scale(0.98);}
.btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--text);}
.btn-danger{background:transparent; border:1px solid var(--expense); color:var(--expense);}
.row{display:flex; gap:12px; flex-wrap:wrap;}
.row > *{flex:1; min-width:140px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:220px; background:var(--surface); border-right:1px solid var(--line);
  padding:24px 14px; flex-shrink:0; position:sticky; top:0; height:100vh;
}
#sidebar h1{font-size:19px; padding:0 10px 22px; letter-spacing:.02em;}
#sidebar h1 span{color:var(--loan);}
.navitem{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:8px;
  color:var(--muted); cursor:pointer; margin-bottom:2px; font-size:14px; font-weight:500;
}
.navitem.active{background:var(--surface-2); color:var(--text);}
.navitem:hover{color:var(--text);}
.navdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}

#main{flex:1; padding:32px 40px; max-width:980px; margin:0 auto; width:100%;}
.pagehead{margin-bottom:26px;}
.pagehead h2{font-size:26px;}
.pagehead p{color:var(--muted); margin-top:4px; font-size:14px;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:18px;
}
.card h3{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:14px; font-weight:600; font-family:'Inter',sans-serif;}

.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:18px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
.stat .label{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
.stat .value{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
.stat .value.pos{color:var(--income);}
.stat .value.neg{color:var(--expense);}

table{width:100%; border-collapse:collapse; font-size:14px;}
th{text-align:left; color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--line-strong);}
td{padding:9px 10px; border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
td.amt, th.amt{text-align:right; font-family:'IBM Plex Mono',monospace;}
.tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.tag.income{background:rgba(63,174,122,.15); color:var(--income);}
.tag.expense{background:rgba(255,122,89,.15); color:var(--expense);}
.tag.loan{background:rgba(92,138,196,.15); color:var(--loan);}
.tag.rental{background:rgba(62,156,156,.15); color:var(--rental);}
.tag.lottery{background:rgba(216,174,76,.15); color:var(--lottery);}

.barrow{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.barrow .barname{width:120px; font-size:13px; color:var(--muted); flex-shrink:0;}
.barrow .bartrack{flex:1; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.barrow .barfill{height:100%; border-radius:5px;}
.barrow .barval{width:80px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:13px; flex-shrink:0;}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.chip{padding:7px 14px; border-radius:20px; border:1px solid var(--line-strong); color:var(--muted); font-size:13px; cursor:pointer; font-weight:500;}
.chip.active{background:var(--loan); border-color:var(--loan); color:#0B1524;}

.typegrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
.typecard{
  border:1px solid var(--line-strong); border-radius:10px; padding:14px 10px; text-align:center;
  cursor:pointer; background:var(--surface-2); font-size:13px; font-weight:600;
}
.typecard.active{border-color:var(--loan); background:rgba(92,138,196,.12); color:var(--loan);}

.empty{color:var(--muted); font-size:14px; padding:30px 0; text-align:center;}
.divider{height:1px; background:var(--line); margin:18px 0;}
.subnote{font-size:12px; color:var(--muted); margin-top:6px;}
.delbtn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px;}
.delbtn:hover{color:var(--expense);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-2);
  border:1px solid var(--line-strong); padding:10px 20px; border-radius:8px; font-size:13px; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.show{opacity:1;}
.confirm-overlay{position:fixed; inset:0; background:rgba(6,11,20,.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.confirm-overlay.show{display:flex;}
.confirm-box{background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; padding:22px; max-width:340px; width:100%;}
.confirm-box p{font-size:14px; margin:0 0 18px; color:var(--text); line-height:1.5;}
.confirm-actions{display:flex; gap:10px; justify-content:flex-end;}
#confirmYes{background:var(--expense); border:none; color:#fff;}
.monthgroup{border-bottom:1px solid var(--line); margin-bottom:2px;}
.monthgroup:last-child{border-bottom:none;}
.monthgroup summary{
  cursor:pointer; padding:12px 4px; display:flex; align-items:center; gap:8px;
  font-size:14px; font-weight:600; list-style:none;
}
.monthgroup summary::-webkit-details-marker{display:none;}
.monthgroup summary .mgcaret{color:var(--muted); font-size:11px; transition:transform .15s; flex-shrink:0;}
.monthgroup[open] summary .mgcaret{transform:rotate(90deg);}
.monthgroup summary .mglabel{font-family:'Inter',sans-serif; font-weight:600;}
.monthgroup summary .mgtotal{margin-left:auto; font-family:'IBM Plex Mono',monospace;}
.monthbody{padding:6px 4px 16px 20px;}
.netbadge{
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--surface-2); border-radius:8px; padding:9px 12px; margin:-2px 0 16px; border-left:3px solid var(--line-strong);
}
.netbadge-detail{font-size:12px; color:var(--muted);}
.netbadge-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap;}
.monthrow{padding:16px 4px; border-bottom:1px solid var(--line);}
.monthrow:last-child{border-bottom:none;}
.monthrow-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:10px;}
.monthrow-label{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
.monthrow-net{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:16px; white-space:nowrap;}
.monthrow-sub{display:flex; gap:16px; font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-bottom:10px;}
.monthrow-balance{display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); border-radius:8px; padding:9px 12px;}
.monthrow-balance .bal-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.monthrow-balance .bal-val{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;}
.monthrow-trend{font-size:11.5px; font-family:'IBM Plex Mono',monospace; text-align:right; margin-top:5px;}
.cardgroup{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;}
.cardgroup summary{cursor:pointer; padding:18px 20px; display:flex; align-items:center; gap:10px; list-style:none; font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
.cardgroup summary::-webkit-details-marker{display:none;}
.cardgroup summary .mgcaret{color:var(--muted); font-size:12px; transition:transform .15s; flex-shrink:0;}
.cardgroup[open] summary .mgcaret{transform:rotate(90deg);}
.cardgroup-body{padding:0 20px 20px;}
.danger-card{border-color:rgba(255,122,89,.35) !important;}

/* ---------- Mobile: bottom tab bar like an iOS app ---------- */
#bottomnav{display:none;}
@media (max-width: 780px){
  #sidebar{display:none;}
  #main{padding:18px 16px 90px; }
  .statgrid{grid-template-columns:repeat(2,1fr);}
  .typegrid{grid-template-columns:repeat(3,1fr);}
  #bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--line); padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:40; justify-content:space-around;
  }
  #bottomnav .navitem{flex-direction:column; gap:3px; font-size:10px; padding:6px 4px; flex:1; text-align:center; border-radius:0; background:none !important;}
  #bottomnav .navitem.active{color:var(--loan);}
  #bottomnav .navdot{width:6px;height:6px;}
  table{font-size:12.5px;}
  th,td{padding:7px 6px;}
  .barrow .barname{width:88px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Led<span>ger</span></h1>
    <div id="navlist"></div>
  </div>
  <div id="main"></div>
</div>
<div id="bottomnav"></div>
<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirmNo">Cancel</button>
      <button class="btn" id="confirmYes">Delete</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
const NAV = [
  {id:'reports', label:'Reports'},
  {id:'dashboard', label:'Transactions'},
  {id:'add', label:'Add Entry'},
  {id:'loans', label:'Loans & Setup'},
];
const DEFAULT_CATEGORIES = ['Groceries','Utilities','Transport','Dining','Entertainment','Health','Shopping','Insurance','Subscriptions','Education','Salary','Bonus','Interest','Gift','Side Income','Other Income','Other Expense','Other'];
const TYPE_META = {
  expense:{label:'Expense', color:'var(--expense)', tag:'expense'},
  income:{label:'Income', color:'var(--income)', tag:'income'},
  loan_payment:{label:'Loan Payment', color:'var(--loan)', tag:'loan'},
  rental_income:{label:'Rental Income', color:'var(--rental)', tag:'rental'},
  lottery_expense:{label:'Lottery Spend', color:'var(--lottery)', tag:'lottery'},
  lottery_income:{label:'Lottery Win', color:'var(--lottery)', tag:'lottery'},
};

/* ============ STATE ============ */
let state = { transactions:[], loans:[], categories:[...DEFAULT_CATEGORIES], settings:{ bankOpeningBalance:0, bankOpeningDate: '1970-01-01', bankSnapshots:[] }, loaded:false };
let currentTab = 'reports';
let reportView = 'monthly';
let addType = 'expense';
let editingTxId = null;
let editingLoanId = null;
let editingCheckpoint = null; // {account, id}

/* Works inside Claude.ai (uses window.storage) AND standalone anywhere else
   (falls back to the browser's own localStorage) — same file, either place. */
const storage = (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function')
  ? window.storage
  : {
      async get(key){ try{ const v = localStorage.getItem('ledger:'+key); return v!==null ? {key, value:v} : null; }catch(e){ return null; } },
      async set(key, value){ try{ localStorage.setItem('ledger:'+key, value); return {key, value}; }catch(e){ return null; } },
      async delete(key){ try{ localStorage.removeItem('ledger:'+key); return {key, deleted:true}; }catch(e){ return null; } },
    };
let categoryViewMode = 'month'; // 'month' or 'category'
let moreReportView = 'networth';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Number(n)||0; const neg = n<0; n=Math.abs(n); return (neg?'-':'')+'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function monthKey(d){ return d.slice(0,7); }
function monthLabel(k){ const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function showConfirm(message, onYes, yesLabel){
  const overlay = document.getElementById('confirmOverlay');
  document.getElementById('confirmMsg').textContent = message;
  const yesBtn = document.getElementById('confirmYes');
  yesBtn.textContent = yesLabel || 'Delete';
  overlay.classList.add('show');
  const cleanup = ()=> overlay.classList.remove('show');
  yesBtn.onclick = ()=>{ cleanup(); onYes(); };
  document.getElementById('confirmNo').onclick = cleanup;
}

/* ============ STORAGE ============ */
async function loadState(){
  try{ const r = await storage.get('transactions'); state.transactions = r? JSON.parse(r.value): []; }catch(e){ state.transactions=[]; }
  try{ const r = await storage.get('loans'); state.loans = r? JSON.parse(r.value): []; }catch(e){ state.loans=[]; }
  try{ const r = await storage.get('settings'); state.settings = r? JSON.parse(r.value): {bankOpeningBalance:0,bankOpeningDate:'1970-01-01',bankSnapshots:[]}; }catch(e){ state.settings={bankOpeningBalance:0,bankOpeningDate:'1970-01-01',bankSnapshots:[]}; }
  try{
    const r = await storage.get('categories');
    const parsed = r? JSON.parse(r.value): [...DEFAULT_CATEGORIES];
    state.categories = Array.isArray(parsed) ? parsed : Array.from(new Set([...(parsed.expense||[]), ...(parsed.income||[])]));
  }catch(e){ state.categories = [...DEFAULT_CATEGORIES]; }
  if(!state.settings.bankSnapshots) state.settings.bankSnapshots = [];
  state.loans.forEach(l=>{ if(!l.snapshots) l.snapshots = []; });
  ['Other Income','Other Expense','Lottery'].forEach(c=>{ if(!state.categories.includes(c)) state.categories.push(c); });
  let migrated = false;
  state.transactions.forEach(t=>{
    if(t.type==='lottery_expense'){ t.type='expense'; t.category='Lottery'; migrated=true; }
    if(t.type==='lottery_income'){ t.type='income'; t.category='Lottery'; migrated=true; }
  });
  state.transactions.forEach(t=>{
    if(!t.isBalanceCheckpoint && typeof t.notes==='string' && t.notes.indexOf('Auto-added to reconcile')===0){
      t.isBalanceCheckpoint = true;
      t.checkpointBalance = calcBankBalanceAsOf(t.date);
      migrated = true;
    }
  });
  if(migrated) saveTransactions();
  state.loaded = true;
  render();
}
async function saveTransactions(){ try{ await storage.set('transactions', JSON.stringify(state.transactions)); }catch(e){ showToast('Save failed — try again'); } }
async function saveLoans(){ try{ await storage.set('loans', JSON.stringify(state.loans)); }catch(e){ showToast('Save failed — try again'); } }
async function saveSettings(){ try{ await storage.set('settings', JSON.stringify(state.settings)); }catch(e){ showToast('Save failed — try again'); } }
async function saveCategories(){ try{ await storage.set('categories', JSON.stringify(state.categories)); }catch(e){ showToast('Save failed — try again'); } }

async function addTransaction(tx){ tx.id = uid(); state.transactions.push(tx); await saveTransactions(); showToast('Entry saved'); currentTab='dashboard'; render(); }
async function deleteTransaction(id){ state.transactions = state.transactions.filter(t=>t.id!==id); await saveTransactions(); render(); }
async function addLoan(loan){ loan.id = uid(); state.loans.push(loan); await saveLoans(); render(); }
async function deleteLoan(id){ state.loans = state.loans.filter(l=>l.id!==id); await saveLoans(); render(); }

/* ============ DERIVED DATA ============ */
function cashDelta(t){
  if(t.type==='income'||t.type==='rental_income'||t.type==='lottery_income') return t.amount;
  if(t.type==='expense'||t.type==='loan_payment'||t.type==='lottery_expense') return -t.amount;
  return 0;
}
function sortedTx(){ return [...state.transactions].sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id)); }

/* Merge opening balance + checkpoints + transactions into one chronological
   timeline. A checkpoint resets the running balance to a known value (so you
   can enter "balance was $X on this date" instead of re-entering years of
   old transactions), and everything after it accumulates normally on top. */
function mergeTimeline(openingDate, openingBalance, checkpoints, txEvents){
  const items = [];
  items.push({date:openingDate||'', rank:0, kind:'snapshot', balance:Number(openingBalance)||0, label:'Opening balance'});
  (checkpoints||[]).forEach(c=> items.push({date:c.date, rank:0, kind:'snapshot', balance:Number(c.balance)||0, label:'Balance checkpoint', cpId:c.id}));
  (txEvents||[]).forEach(e=> items.push({date:e.date, rank:1, kind:'tx', delta:e.delta, label:e.label, id:e.id}));
  items.sort((a,b)=> a.date.localeCompare(b.date) || a.rank-b.rank);
  let bal = 0;
  const rows = [];
  for(const it of items){
    if(it.kind==='snapshot'){ bal = it.balance; rows.push({date:it.date, label:it.label, delta:0, balance:bal, checkpoint:true, cpId:it.cpId}); }
    else { bal += it.delta; rows.push({date:it.date, label:it.label, delta:it.delta, balance:bal, id:it.id}); }
  }
  return rows;
}
function bankTimeline(){
  const events = sortedTx().map(t=>({date:t.date, delta:cashDelta(t), label:describeTx(t), id:t.id}));
  return mergeTimeline(state.settings.bankOpeningDate, state.settings.bankOpeningBalance, state.settings.bankSnapshots, events);
}
function calcBankBalanceAsOf(date){
  const tl = bankTimeline();
  let bal = tl.length ? tl[0].balance : 0;
  for(const row of tl){ if(row.date <= date) bal = row.balance; else break; }
  return bal;
}
function loanTimeline(loan){
  const events = sortedTx().filter(t=>t.type==='loan_payment' && t.loanId===loan.id).map(t=>{
    const principal = (t.principal!==undefined && t.principal!==null && t.principal!=='') ? Number(t.principal) : null;
    const label = principal!==null
      ? `Payment ${fmt(t.amount)} (principal ${fmt(principal)})`
      : `Payment ${fmt(t.amount)} (principal/interest split unknown — balance unchanged, relying on checkpoints)`;
    return {date:t.date, delta: principal!==null ? -principal : 0, label, id:t.id};
  });
  return mergeTimeline(loan.startDate, loan.openingBalance, loan.snapshots, events);
}
function loanBalance(loan){
  const tl = loanTimeline(loan);
  return tl.length? tl[tl.length-1].balance : (Number(loan.openingBalance)||0);
}
function loanBalanceAsOf(loan, date){
  const tl = loanTimeline(loan);
  let bal = tl.length ? tl[0].balance : (Number(loan.openingBalance)||0);
  for(const row of tl){ if(row.date<=date) bal = row.balance; else break; }
  return bal;
}
function totalLoanBalanceAsOf(date){
  return state.loans.reduce((s,l)=>s+loanBalanceAsOf(l,date),0);
}
function netWorthAsOf(date){
  return calcBankBalanceAsOf(date) - totalLoanBalanceAsOf(date);
}
function describeTx(t){
  const meta = TYPE_META[t.type];
  if(t.type==='loan_payment'){ const l=state.loans.find(x=>x.id===t.loanId); return 'Loan payment — '+(l?l.name:'Unknown loan'); }
  if(t.type==='rental_income'){ const l=state.loans.find(x=>x.id===t.loanId); return 'Rental income — '+(l?l.name:'Unlinked property'); }
  if(t.category) return meta.label+' — '+t.category;
  return meta.label;
}
function monthlyTotals(){
  const map = {};
  for(const t of state.transactions){
    const mk = monthKey(t.date);
    if(!map[mk]) map[mk] = {income:0, expense:0};
    const d = cashDelta(t);
    if(d>=0) map[mk].income += d; else map[mk].expense += -d;
  }
  return Object.keys(map).sort().map(k=>({month:k, ...map[k], net: map[k].income-map[k].expense}));
}
function monthlyCategoryMap(){
  const income = {}, expense = {};
  for(const t of state.transactions){
    if(t.type!=='income' && t.type!=='expense') continue;
    if(!t.category) continue;
    const mk = monthKey(t.date);
    const bucket = t.type==='income' ? income : expense;
    if(!bucket[mk]) bucket[mk] = {};
    bucket[mk][t.category] = (bucket[mk][t.category]||0) + t.amount;
  }
  return {income, expense};
}
function transposeToCategory(monthMap){
  // monthMap: {month: {cat: amt}} -> {cat: {month: amt}}
  const byCat = {};
  for(const mk in monthMap){ for(const cat in monthMap[mk]){ if(!byCat[cat]) byCat[cat] = {}; byCat[cat][mk] = monthMap[mk][cat]; } }
  return byCat;

function investmentPositions(){
  const invLoans = state.loans.filter(l=>l.type==='investment');
  const result = {};
  for(const l of invLoans){
    const monthMap = {};
    for(const t of state.transactions){
      if(t.loanId!==l.id) continue;
      const mk = monthKey(t.date);
      if(!monthMap[mk]) monthMap[mk] = {rental:0, payment:0};
      if(t.type==='rental_income') monthMap[mk].rental += t.amount;
      if(t.type==='loan_payment') monthMap[mk].payment += t.amount;
    }
    result[l.id] = {loan:l, months: Object.keys(monthMap).sort().map(k=>({month:k, ...monthMap[k], net: monthMap[k].rental - monthMap[k].payment}))};
  }
  return result;
}
function lotteryTotals(){
  const isLottery = t => t.category==='Lottery' && (t.type==='income' || t.type==='expense');
  const income = state.transactions.filter(t=>isLottery(t) && t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = state.transactions.filter(t=>isLottery(t) && t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const monthMap={};
  for(const t of state.transactions){
    if(!isLottery(t)) continue;
    const mk = monthKey(t.date);
    if(!monthMap[mk]) monthMap[mk]={income:0,expense:0};
    if(t.type==='income') monthMap[mk].income += t.amount; else monthMap[mk].expense += t.amount;
  }
  return {income, expense, net:income-expense, months: Object.keys(monthMap).sort().map(k=>({month:k,...monthMap[k], net: monthMap[k].income-monthMap[k].expense}))};
}

function parseCSV(text){
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = ()=>{ row.push(field); field=''; };
  const pushRow = ()=>{ rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushField(); pushRow(); i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ pushField(); pushRow(); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]||'').trim());
    return obj;
  });
}

function reportNetWorth(){
  const rows = monthlyTotals().slice().reverse();
  if(!rows.length) return '<div class="card"><div class="empty">No data yet.</div></div>';
  const withNW = rows.map(r=>({month:r.month, nw: netWorthAsOf(r.month+'-31')}));
  const yearMap = {};
  withNW.forEach((r,i)=>{ const yr = r.month.slice(0,4); if(!yearMap[yr]) yearMap[yr]=[]; yearMap[yr].push({...r, _idx:i}); });
  const years = Object.keys(yearMap).sort().reverse();
  const rowHtml = r=>{
    const prev = withNW[r._idx+1];
    let trendHtml = '';
    if(prev){
      const delta = r.nw - prev.nw;
      const arrow = delta>0?'▲':delta<0?'▼':'—';
      const color = delta>0?'var(--income)':delta<0?'var(--expense)':'var(--muted)';
      trendHtml = `<div class="monthrow-trend" style="color:${color}">${arrow} ${fmt(Math.abs(delta))} vs previous month</div>`;
    }
    return `<div class="monthrow">
      <div class="monthrow-top"><span class="monthrow-label">${monthLabel(r.month)}</span><span class="monthrow-net" style="color:${r.nw>=0?'var(--income)':'var(--expense)'}">${fmt(r.nw)}</span></div>
      ${trendHtml}
    </div>`;
  };
  const currentNW = withNW.length ? withNW[0].nw : 0;
  return `
  <div class="statgrid" style="margin-bottom:18px;"><div class="stat"><div class="label">Net worth today</div><div class="value ${currentNW>=0?'pos':'neg'}">${fmt(currentNW)}</div></div></div>
  <p class="subnote" style="margin-bottom:16px;">Bank balance minus total loan balance, at the end of each month. ${state.loans.length? '' : 'You have no loans tracked yet, so this currently just mirrors your bank balance — add a loan in Loans & Setup to see it factored in.'}</p>
  <div class="row" style="margin-bottom:16px; gap:8px;">
    <button class="btn btn-ghost" type="button" data-expandall="1" data-expandscope="moreReportBody" style="flex:0 0 auto; font-size:13px; padding:8px 14px;">Expand all years</button>
    <button class="btn btn-ghost" type="button" data-expandall="0" data-expandscope="moreReportBody" style="flex:0 0 auto; font-size:13px; padding:8px 14px;">Collapse all years</button>
  </div>
  <div class="card"><h3>Net worth by month</h3>
  ${years.map((yr,i)=>`<details class="monthgroup" ${i===0?'open':''}>
    <summary><span class="mgcaret">▸</span><span class="mglabel">${yr}</span><span class="mgtotal">${yearMap[yr].length} month${yearMap[yr].length===1?'':'s'}</span></summary>
    <div class="monthbody">${yearMap[yr].map(rowHtml).join('')}</div>
  </details>`).join('')}
  </div>`;
}

function reportYearly(){
  const rows = monthlyTotals();
  if(!rows.length) return '<div class="card"><div class="empty">No data yet.</div></div>';
  const yearMap = {};
  rows.forEach(r=>{ const yr = r.month.slice(0,4); if(!yearMap[yr]) yearMap[yr]={income:0,expense:0}; yearMap[yr].income+=r.income; yearMap[yr].expense+=r.expense; });
  const years = Object.keys(yearMap).sort().reverse();
  return `<div class="card"><h3>Yearly summary</h3><table><thead><tr><th>Year</th><th class="amt">Income</th><th class="amt">Expense</th><th class="amt">Net</th><th class="amt">Year-end balance</th></tr></thead><tbody>
  ${years.map(yr=>{
    const y = yearMap[yr];
    const net = y.income - y.expense;

  }).join('')}
  </tbody></table></div>`;
}

function reportIncomeSources(){
  const totals = {};
  let grandTotal = 0;
  state.transactions.forEach(t=>{
    if(t.type!=='income' || !t.category) return;
    totals[t.category] = (totals[t.category]||0) + t.amount;
    grandTotal += t.amount;
  });
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return '<div class="card"><div class="empty">No income entries yet.</div></div>';
  const max = Math.max(...entries.map(e=>e[1]),1);
  return `<div class="card"><h3>Income by source (all time)</h3>
  ${entries.map(([cat,val])=>{
    const pct = grandTotal>0 ? (val/grandTotal*100) : 0;
    return `<div class="barrow"><div class="barname">${cat}</div><div class="bartrack"><div class="barfill" style="width:${val/max*100}%; background:var(--income)"></div></div><div class="barval">${fmt(val)}</div></div><div class="subnote" style="margin:-4px 0 10px;">${pct.toFixed(1)}% of total income</div>`;
  }).join('')}
  </div>`;
}

function reportReconciliation(){
  let realIncome=0, realExpense=0, adjIncome=0, adjExpense=0;
  const yearMap = {};
  state.transactions.forEach(t=>{
    if(t.type!=='income' && t.type!=='expense') return;
    const yr = (t.date||'').slice(0,4) || 'Unknown';
    if(!yearMap[yr]) yearMap[yr] = {real:0, adj:0};
    if(t.isBalanceCheckpoint){
      if(t.type==='income'){ adjIncome+=t.amount; yearMap[yr].adj+=t.amount; }
      else{ adjExpense+=t.amount; yearMap[yr].adj+=t.amount; }
    } else {
      if(t.type==='income'){ realIncome+=t.amount; yearMap[yr].real+=t.amount; }
      else{ realExpense+=t.amount; yearMap[yr].real+=t.amount; }
    }
  });
  const totalReal = realIncome+realExpense;
  const totalAdj = adjIncome+adjExpense;
  const totalAll = totalReal+totalAdj;
  const pctReal = totalAll>0 ? (totalReal/totalAll*100) : 100;
  const years = Object.keys(yearMap).sort().reverse();
  return `
  <p class="subnote" style="margin-bottom:16px;">How much of your recorded cash flow comes from real, categorized entries vs auto-generated balance adjustments. A high adjustment share in a year usually means that year relied more on end-of-month balances than granular entries — not wrong, just less detailed.</p>
  <div class="statgrid" style="margin-bottom:18px;">
    <div class="stat"><div class="label">Real entries</div><div class="value pos">${fmt(totalReal)}</div></div>
    <div class="stat"><div class="label">Auto-adjustments</div><div class="value">${fmt(totalAdj)}</div></div>
    <div class="stat"><div class="label">% explained by real entries</div><div class="value">${pctReal.toFixed(1)}%</div></div>
  </div>
  <div class="card"><h3>By year</h3><table><thead><tr><th>Year</th><th class="amt">Real entries</th><th class="amt">Adjustments</th><th class="amt">% real</th></tr></thead><tbody>
  ${years.map(yr=>{
    const y = yearMap[yr];
    const total = y.real+y.adj;
    const pct = total>0 ? (y.real/total*100) : 100;
    return `<tr><td>${yr}</td><td class="amt">${fmt(y.real)}</td><td class="amt">${fmt(y.adj)}</td><td class="amt" style="color:${pct>=80?'var(--income)':pct>=50?'var(--muted)':'var(--expense)'}">${pct.toFixed(0)}%</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}

function reportBiggest(){

function reportAverages(){
  const rows = monthlyTotals();
  if(!rows.length) return '<div class="card"><div class="empty">No data yet.</div></div>';
  const withNet = rows.map(r=>({...r, net:r.income-r.expense}));
  const avgIncome = withNet.reduce((s,r)=>s+r.income,0)/withNet.length;
  const avgExpense = withNet.reduce((s,r)=>s+r.expense,0)/withNet.length;
  const avgNet = withNet.reduce((s,r)=>s+r.net,0)/withNet.length;
  const best = withNet.slice().sort((a,b)=>b.net-a.net)[0];
  const worst = withNet.slice().sort((a,b)=>a.net-b.net)[0];
  return `
  <div class="statgrid" style="margin-bottom:18px;">
    <div class="stat"><div class="label">Avg monthly income</div><div class="value pos">+${fmt(avgIncome)}</div></div>
    <div class="stat"><div class="label">Avg monthly expense</div><div class="value neg">-${fmt(avgExpense)}</div></div>
    <div class="stat"><div class="label">Avg monthly net</div><div class="value ${avgNet>=0?'pos':'neg'}">${avgNet>=0?'+':''}${fmt(avgNet)}</div></div>
  </div>
  <div class="statgrid">
    <div class="stat"><div class="label">Best month</div><div class="value pos">${monthLabel(best.month)}: +${fmt(best.net)}</div></div>
    <div class="stat"><div class="label">Worst month</div><div class="value neg">${monthLabel(worst.month)}: ${fmt(worst.net)}</div></div>
  </div>
  <p class="subnote" style="margin-top:16px;">Across ${withNet.length} month${withNet.length===1?'':'s'} of data.</p>`;
}

function findCheckpoint(ref){
  if(!ref) return {date:todayStr(), balance:0};
  if(ref.account==='bank') return (state.settings.bankSnapshots||[]).find(c=>c.id===ref.id) || {date:todayStr(), balance:0};
  if(ref.account==='banktx'){ const tx = state.transactions.find(t=>t.id===ref.id); return tx ? {date:tx.date, balance:tx.checkpointBalance} : {date:todayStr(), balance:0}; }
  const loan = state.loans.find(l=>l.id===ref.account);
  return loan ? (loan.snapshots||[]).find(c=>c.id===ref.id) || {date:todayStr(), balance:0} : {date:todayStr(), balance:0};
}

  const rows = [];
  (state.settings.bankSnapshots||[]).forEach(c=> rows.push({date:c.date, account:'Bank account', detail:fmt(c.balance)+' (checkpoint)', editAttr:`data-editcheckpoint="bank::${c.id}"`, delAttr:`data-delcheckpoint="bank::${c.id}"`}));
  state.loans.forEach(l=> (l.snapshots||[]).forEach(c=> rows.push({date:c.date, account:l.name+' (loan)', detail:fmt(c.balance)+' (checkpoint)', editAttr:`data-editcheckpoint="${l.id}::${c.id}"`, delAttr:`data-delcheckpoint="${l.id}::${c.id}"`})));
  state.transactions.filter(t=>t.isBalanceCheckpoint).forEach(t=>{
    rows.push({date:t.date, account:'Bank account', detail:'Target balance '+fmt(t.checkpointBalance)+' (adjusted '+(t.type==='income'?'+':'-')+fmt(t.amount)+')', editAttr:`data-editcheckpoint="banktx::${t.id}"`, delAttr:`data-del="${t.id}"`});
  });
  state.transactions.filter(t=>!t.isBalanceCheckpoint && (t.category==='Other Income'||t.category==='Other Expense')).forEach(t=>{
    const sign = t.category==='Other Income' ? '+' : '-';
    rows.push({date:t.date, account:'Bank account', detail:sign+fmt(t.amount)+' ('+t.category+', manual)', editAttr:`data-edittx="${t.id}"`, delAttr:`data-del="${t.id}"`});
  });
  if(!rows.length) return '<div class="empty">No checkpoints or balance adjustments yet.</div>';
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  return `<table><thead><tr><th>Date</th><th>Account</th><th class="amt">Detail</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.account}</td><td class="amt">${r.detail}</td><td style="white-space:nowrap;"><button class="delbtn" ${r.editAttr} title="Edit">✎</button><button class="delbtn" ${r.delAttr} title="Delete">✕</button></td></tr>`).join('')}
  </tbody></table>
  <div class="row" style="margin-top:12px;"><button class="btn btn-ghost" type="button" id="recomputeCheckpointsBtn" style="flex:0 0 auto; font-size:13px;">Recompute all balance checkpoints</button></div>
  <p class="subnote" style="margin-top:8px;">If you edit an older balance, later adjustments were calculated against the old (wrong) number. Click "Recompute all" afterward to recalculate every adjustment fresh, in date order.</p>`;
}

    <div class="cardgroup-body">

/* ============ EVENT WIRING ============ */
function attachHandlers(){
  document.querySelectorAll('[data-type]').forEach(el=>{
    el.onclick = ()=>{ addType = el.dataset.type; render(); };
  });
  document.querySelectorAll('[data-report]').forEach(el=>{
    el.onclick = ()=>{ reportView = el.dataset.report; document.querySelectorAll('[data-report]').forEach(c=>c.classList.toggle('active', c.dataset.report===reportView)); document.getElementById('reportBody').innerHTML = renderReportBody(); attachHandlers(); };
  });
  document.querySelectorAll('[data-catview]').forEach(el=>{
    el.onclick = ()=>{ categoryViewMode = el.dataset.catview; document.getElementById('reportBody').innerHTML = renderReportBody(); attachHandlers(); };
  });
  document.querySelectorAll('[data-morereport]').forEach(el=>{
    el.onclick = ()=>{ moreReportView = el.dataset.morereport; document.querySelectorAll('[data-morereport]').forEach(c=>c.classList.toggle('active', c.dataset.morereport===moreReportView)); document.getElementById('moreReportBody').innerHTML = renderMoreReportBody(); attachHandlers(); };
  });
  document.querySelectorAll('[data-expandall]').forEach(el=>{
    el.onclick = ()=>{
      const open = el.dataset.expandall==='1';
      const scopeId = el.dataset.expandscope;
      const container = scopeId ? document.getElementById(scopeId) : document;
      if(container) container.querySelectorAll('.monthgroup').forEach(d=>{ if(open) d.setAttribute('open',''); else d.removeAttribute('open'); });
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=> showConfirm('Delete this entry? This can\'t be undone.', ()=>{ deleteTransaction(el.dataset.del); showToast('Entry deleted'); });
  });
  document.querySelectorAll('[data-delloan]').forEach(el=>{
    el.onclick = ()=>{
      const linked = state.transactions.some(t=>t.loanId===el.dataset.delloan);
      const msg = linked ? 'This loan has linked entries. Delete it anyway? The entries will remain but show as unlinked.' : 'Delete this loan?';
      showConfirm(msg, ()=> deleteLoan(el.dataset.delloan));
    };
  });
  const catSelect = document.getElementById('catSelect');
  if(catSelect) catSelect.onchange = ()=>{
    const newInput = document.getElementById('newCatInput');
    if(catSelect.value==='__new__'){ newInput.style.display='block'; newInput.focus(); }
    else { newInput.style.display='none'; }
  };
  const ef = document.getElementById('entryForm');
  if(ef) ef.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(ef);
    const tx = { type: addType, date: fd.get('date') };
    if(fd.has('category')){
      let cat = fd.get('category');
      if(cat==='__new__'){
        cat = (fd.get('newCategory')||'').trim();
        if(!cat){ showToast('Enter a name for the new category'); return; }
        if(!state.categories.includes(cat)){ state.categories.push(cat); saveCategories(); }
      }
      tx.category = cat;
    }
    if(fd.has('loanId')) tx.loanId = fd.get('loanId');
    if(addType==='loan_payment'){
      const p = fd.get('principal');
      tx.principal = (p!==null && p!=='') ? parseFloat(p) : null;
    }
    tx.amount = parseFloat(fd.get('amount'));
    tx.notes = fd.get('notes') || '';
    if(isNaN(tx.amount) || tx.amount<0){ showToast('Enter a valid amount'); return; }
    if((addType==='loan_payment'||addType==='rental_income') && !tx.loanId){ showToast('Add a loan first'); return; }
    if(editingTxId){
      const idx = state.transactions.findIndex(t=>t.id===editingTxId);
      if(idx>-1){ tx.id = editingTxId; state.transactions[idx] = tx; saveTransactions().then(()=>{ showToast('Entry updated'); editingTxId=null; currentTab='dashboard'; render(); }); }
    } else {
      addTransaction(tx);
    }
  };
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ editingTxId=null; currentTab='dashboard'; render(); };
  document.querySelectorAll('[data-edittx]').forEach(el=>{
    el.onclick = ()=>{ editingTxId = el.dataset.edittx; currentTab='add'; render(); window.scrollTo(0,0); };
  });
  const sf = document.getElementById('settingsForm');
  if(sf) sf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(sf);
    state.settings.bankOpeningBalance = parseFloat(fd.get('bankOpeningBalance'))||0;
    state.settings.bankOpeningDate = fd.get('bankOpeningDate');
    saveSettings().then(()=>{ showToast('Settings saved'); render(); });
  };
  const lf = document.getElementById('loanForm');
  if(lf) lf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(lf);
    const name = fd.get('name');
    if(!name.trim()){ showToast('Enter a loan name'); return; }
    if(editingLoanId){
      const loan = state.loans.find(l=>l.id===editingLoanId);
      loan.name = name; loan.type = fd.get('type'); loan.openingBalance = parseFloat(fd.get('openingBalance'))||0; loan.startDate = fd.get('startDate')||todayStr();
      saveLoans().then(()=>{ showToast('Loan updated'); editingLoanId=null; render(); });
    } else {
      const loan = { name, type: fd.get('type'), openingBalance: parseFloat(fd.get('openingBalance'))||0, startDate: fd.get('startDate')||todayStr(), snapshots:[] };
      addLoan(loan).then(()=>showToast('Loan added'));
      lf.reset();
    }
  };
  document.querySelectorAll('[data-editloan]').forEach(el=>{
    el.onclick = ()=>{ editingLoanId = el.dataset.editloan; render(); window.scrollTo(0,0); };
  });
  const cancelLoanEditBtn = document.getElementById('cancelLoanEditBtn');
  if(cancelLoanEditBtn) cancelLoanEditBtn.onclick = ()=>{ editingLoanId=null; render(); };
  const cf = document.getElementById('checkpointForm');
  if(cf) cf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(cf);
    const balance = parseFloat(fd.get('balance'));
    const date = fd.get('date');
    if(isNaN(balance)){ showToast('Enter a valid balance'); return; }
    if(editingCheckpoint){
      if(editingCheckpoint.account==='banktx'){
        const idx = state.transactions.findIndex(t=>t.id===editingCheckpoint.id);
        if(idx>-1) state.transactions.splice(idx,1);
        const baseline = calcBankBalanceAsOf(date);
        const diff = balance - baseline;
        if(Math.abs(diff) < 0.005){
          saveTransactions().then(()=>{ showToast('Updated — balances now match without needing an adjustment'); editingCheckpoint=null; render(); });
        } else {
          const tx = {
            id: editingCheckpoint.id, date,
            type: diff>0 ? 'income' : 'expense',
            category: diff>0 ? 'Other Income' : 'Other Expense',
            amount: Math.abs(diff),
            notes: 'Auto-added to reconcile to entered balance of '+fmt(balance),
            isBalanceCheckpoint: true,
            checkpointBalance: balance
          };
          state.transactions.push(tx);
          saveTransactions().then(()=>{ showToast('Balance updated'); editingCheckpoint=null; render(); });
        }
      } else {
        const cp = findCheckpoint(editingCheckpoint);
        cp.date = date; cp.balance = balance;
        if(editingCheckpoint.account==='bank'){ saveSettings().then(()=>{ showToast('Checkpoint updated'); editingCheckpoint=null; render(); }); }
        else{ saveLoans().then(()=>{ showToast('Checkpoint updated'); editingCheckpoint=null; render(); }); }
      }
    } else {
      const account = fd.get('account');
      if(account==='bank'){
        const calculated = calcBankBalanceAsOf(date);
        const diff = balance - calculated;
        if(Math.abs(diff) < 0.005){ showToast('Balance already matches — nothing to reconcile'); return; }
        const tx = {
          id: uid(), date,
          type: diff>0 ? 'income' : 'expense',
          category: diff>0 ? 'Other Income' : 'Other Expense',
          amount: Math.abs(diff),
          notes: 'Auto-added to reconcile to entered balance of '+fmt(balance),
          isBalanceCheckpoint: true,
          checkpointBalance: balance
        };
        state.transactions.push(tx);
        saveTransactions().then(()=>{ showToast((diff>0?'Added ':'Added ')+fmt(Math.abs(diff))+' as '+tx.category); render(); });
      } else {
        const entry = {id:uid(), date, balance};
        const loan = state.loans.find(l=>l.id===account);
        if(loan){ loan.snapshots.push(entry); saveLoans().then(()=>{ showToast('Checkpoint added'); render(); }); }
      }
    }
  };
  document.querySelectorAll('[data-editcheckpoint]').forEach(el=>{
    el.onclick = ()=>{
      const [account, id] = el.dataset.editcheckpoint.split('::');
      editingCheckpoint = {account, id};
      currentTab = 'loans';
      render();
      window.scrollTo(0,0);
    };
  });
  const cancelCheckpointEditBtn = document.getElementById('cancelCheckpointEditBtn');
  if(cancelCheckpointEditBtn) cancelCheckpointEditBtn.onclick = ()=>{ editingCheckpoint=null; render(); };
  document.querySelectorAll('[data-delcheckpoint]').forEach(el=>{
    el.onclick = ()=>{
      const [account, id] = el.dataset.delcheckpoint.split('::');
      showConfirm('Delete this balance checkpoint?', ()=>{
        if(account==='bank'){ state.settings.bankSnapshots = state.settings.bankSnapshots.filter(c=>c.id!==id); saveSettings().then(render); }
        else{ const loan = state.loans.find(l=>l.id===account); if(loan){ loan.snapshots = loan.snapshots.filter(c=>c.id!==id); saveLoans().then(render); } }
      });
    };
  });
  const catForm = document.getElementById('catForm');
  if(catForm) catForm.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(catForm); const cat = (fd.get('cat')||'').trim();
    if(cat && !state.categories.includes(cat)){ state.categories.push(cat); saveCategories().then(render); }
  };
  document.querySelectorAll('[data-delcat]').forEach(el=>{
    el.onclick = ()=>{
      const cat = el.dataset.delcat;
      showConfirm('Remove "'+cat+'" from your category list? Existing entries keep this category, it just won\'t appear as an option for new ones.', ()=>{
        state.categories = state.categories.filter(c=>c!==cat);
        saveCategories().then(render);
      }, 'Remove');
    };
  });
  const downloadCsvTemplateBtn = document.getElementById('downloadCsvTemplateBtn');
  if(downloadCsvTemplateBtn) downloadCsvTemplateBtn.onclick = ()=>{
    const invLoan = state.loans.find(l=>l.type==='investment');
    const anyLoan = state.loans[0];
    const lines = [
      'date,type,category,amount,notes,loan_name,principal',
      '2024-01-15,income,Salary,5000,,,',
      '2024-01-20,expense,Groceries,320.50,,,',
      anyLoan ? `2024-01-05,loan_payment,,2200,,${anyLoan.name},650` : '2024-01-05,loan_payment,,2200,,Exact loan name from Loans & Setup,650',
      invLoan ? `2024-01-01,rental_income,,1800,,${invLoan.name},` : '2024-01-01,rental_income,,1800,,Exact investment loan name,',
      '2024-01-10,expense,Lottery,20,,,',
      '2024-01-12,income,Lottery,50,,,',
      '2024-01-31,balance_checkpoint,,15230.55,,,'
    ];
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ledger-bulk-template.csv';
    a.click(); URL.revokeObjectURL(url);
  };
  const bulkCsvFile = document.getElementById('bulkCsvFile');
  if(bulkCsvFile) bulkCsvFile.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const rows = parseCSV(reader.result);
      const resultBoxNow = document.getElementById('bulkImportResult');
      if(!rows.length){ if(resultBoxNow) resultBoxNow.innerHTML = '<div class="empty">No rows found in that file.</div>'; return; }
      const validTypes = ['expense','income','loan_payment','rental_income','lottery_expense','lottery_income','balance_checkpoint'];
      const added = [];
      const checkpointRows = [];
      const errors = [];
      rows.forEach((r,idx)=>{
        const lineNum = idx+2;
        const date = r.date;
        let type = (r.type||'').trim();
        if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)){ errors.push(`Row ${lineNum}: invalid or missing date "${r.date||''}" (need YYYY-MM-DD)`); return; }
        if(!validTypes.includes(type)){ errors.push(`Row ${lineNum}: unknown type "${r.type||''}"`); return; }
        const amount = parseFloat(r.amount);
        if(isNaN(amount) || amount<0){ errors.push(`Row ${lineNum}: invalid amount "${r.amount||''}"`); return; }
        if(type==='balance_checkpoint'){ checkpointRows.push({date, balance:amount}); return; }
        let forcedCategory = null;
        if(type==='lottery_expense'){ type='expense'; forcedCategory='Lottery'; }
        if(type==='lottery_income'){ type='income'; forcedCategory='Lottery'; }
        const tx = {id:uid(), date, type, amount, notes: r.notes||''};
        if(forcedCategory){ tx.category = forcedCategory; if(!state.categories.includes(forcedCategory)) state.categories.push(forcedCategory); added.push(tx); return; }
        if(type==='expense' || type==='income'){
          const cat = (r.category||'').trim();
          if(!cat){ errors.push(`Row ${lineNum}: missing category for ${type}`); return; }
          tx.category = cat;
          if(!state.categories.includes(cat)) state.categories.push(cat);
        }
        if(type==='loan_payment' || type==='rental_income'){
          const loanName = (r.loan_name||'').trim();
          const loan = state.loans.find(l=> l.name.trim().toLowerCase()===loanName.toLowerCase());
          if(!loan){ errors.push(`Row ${lineNum}: no loan found named "${loanName}"`); return; }
          tx.loanId = loan.id;
          if(type==='loan_payment'){
            const p = parseFloat(r.principal);
            tx.principal = (r.principal && !isNaN(p)) ? p : null;
          }
        }
        added.push(tx);
      });
      if(added.length) state.transactions.push(...added);
      let reconciledCount = 0, matchedCount = 0;
      if(checkpointRows.length){
        checkpointRows.sort((a,b)=> a.date.localeCompare(b.date));
        checkpointRows.forEach(cp=>{
          const calculated = calcBankBalanceAsOf(cp.date);
          const diff = cp.balance - calculated;
          if(Math.abs(diff) < 0.005){ matchedCount++; return; }
          const adjTx = {
            id: uid(), date: cp.date,
            type: diff>0 ? 'income' : 'expense',
            category: diff>0 ? 'Other Income' : 'Other Expense',
            amount: Math.abs(diff),
            notes: 'Auto-added to reconcile to bulk-imported balance of '+fmt(cp.balance),
            isBalanceCheckpoint: true,
            checkpointBalance: cp.balance
          };
          state.transactions.push(adjTx);
          added.push(adjTx);
          reconciledCount++;
        });
      }
      if(added.length){
        saveTransactions();
        saveCategories();
      }
      let html = `<div class="netbadge" style="border-left-color:${added.length?'var(--income)':'var(--expense)'}; margin-top:14px;"><div class="netbadge-detail">${added.length} entr${added.length===1?'y':'ies'} added${reconciledCount?` (incl. ${reconciledCount} balance adjustment${reconciledCount===1?'':'s'})`:''}${matchedCount?`, ${matchedCount} balance${matchedCount===1?'':'s'} already matched — nothing added for those`:''}${errors.length?`, ${errors.length} row${errors.length===1?'':'s'} skipped`:''}</div></div>`;
      if(errors.length){
        html += `<div class="subnote" style="margin-top:8px;"><strong>Skipped rows:</strong><br>${errors.map(er=>escapeHtml(er)).join('<br>')}</div>`;
      }
      if(added.length){ render(); showToast(`Added ${added.length} entries`); }
      const resultBox = document.getElementById('bulkImportResult');
      if(resultBox) resultBox.innerHTML = html;
    };
    reader.readAsText(file);
  };
  const recomputeCheckpointsBtn = document.getElementById('recomputeCheckpointsBtn');
  if(recomputeCheckpointsBtn) recomputeCheckpointsBtn.onclick = ()=>{
    showConfirm('Recompute every balance-checkpoint adjustment from scratch, in date order? This corrects any that went stale after an edit. Manually-added Other Income/Expense entries (not tied to a balance checkpoint) are left untouched.', ()=>{
      const targets = state.transactions.filter(t=>t.isBalanceCheckpoint).map(t=>({date:t.date, balance:t.checkpointBalance}));
      state.transactions = state.transactions.filter(t=>!t.isBalanceCheckpoint);
      targets.sort((a,b)=> a.date.localeCompare(b.date));
      let addedCount=0, matchedCount=0;
      targets.forEach(cp=>{
        const calculated = calcBankBalanceAsOf(cp.date);
        const diff = cp.balance - calculated;
        if(Math.abs(diff) < 0.005){ matchedCount++; return; }
        state.transactions.push({
          id: uid(), date: cp.date,
          type: diff>0 ? 'income' : 'expense',
          category: diff>0 ? 'Other Income' : 'Other Expense',
          amount: Math.abs(diff),
          notes: 'Auto-added to reconcile to target balance of '+fmt(cp.balance),
          isBalanceCheckpoint: true,
          checkpointBalance: cp.balance
        });
        addedCount++;
      });
      saveTransactions().then(()=>{
        showToast(`Recomputed ${targets.length} checkpoints: ${addedCount} adjustment${addedCount===1?'':'s'}, ${matchedCount} matched exactly`);
        render();
      });
    }, 'Recompute');
  };
  const eraseAllBtn = document.getElementById('eraseAllBtn');
  if(eraseAllBtn) eraseAllBtn.onclick = ()=>{
    showConfirm('Erase ALL data — every transaction, loan, checkpoint, and category? This cannot be undone.', ()=>{
      state.transactions = [];
      state.loans = [];
      state.categories = [...DEFAULT_CATEGORIES];
      state.settings = { bankOpeningBalance:0, bankOpeningDate: '1970-01-01', bankSnapshots:[] };
      Promise.all([saveTransactions(), saveLoans(), saveCategories(), saveSettings()]).then(()=>{
        showToast('All data erased');
        currentTab = 'dashboard';
        render();
      });
    }, 'Erase everything');
  };
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = ()=>{
    const data = JSON.stringify({transactions:state.transactions, loans:state.loans, settings:state.settings, categories:state.categories}, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ledger-backup-'+todayStr()+'.json';
    a.click(); URL.revokeObjectURL(url);
  };
  const importFile = document.getElementById('importFile');
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }catch(err){ showToast('Invalid file'); return; }
      showConfirm('This will replace your current data with the imported file. Continue?', async ()=>{
        state.transactions = data.transactions || [];
        state.loans = data.loans || [];
        state.settings = data.settings || state.settings;
        state.categories = Array.isArray(data.categories) ? data.categories : (data.categories ? Array.from(new Set([...(data.categories.expense||[]), ...(data.categories.income||[])])) : state.categories);
        state.loans.forEach(l=>{ if(!l.snapshots) l.snapshots = []; });
        if(!state.settings.bankSnapshots) state.settings.bankSnapshots = [];
        await saveTransactions(); await saveLoans(); await saveSettings(); await saveCategories();
        showToast('Data imported');
        render();
      }, 'Import');
    };
    reader.readAsText(file);
  };
}

/* ============ INIT ============ */
loadState();
</script>
</body>
</html>
